services:
  glpi-dedup-db:
    container_name: homolog-glpi-dedup-db
    ports: !override
      - '127.0.0.1:${HOMOLOG_POSTGRES_PORT:-55432}:5432'

  n8n:
    container_name: homolog-n8n

  n8n-gateway:
    container_name: homolog-n8n-gateway
    ports: !override
      - '127.0.0.1:${HOMOLOG_N8N_PORT:-15678}:8080'

  glpi-credential-proxy:
    container_name: homolog-glpi-credential-proxy
    environment:
      - GLPI_UPSTREAM_HOST=host.docker.internal
      - GLPI_UPSTREAM_PORT=${HOMOLOG_GLPI_PORT:-19080}

  local-ai-credential-proxy:
    container_name: homolog-local-ai-credential-proxy

  n8n-task-runners:
    container_name: homolog-n8n-task-runners
    environment:
      - N8N_PUBLIC_BASE_URL=http://localhost:${HOMOLOG_N8N_PORT:-15678}
      - TEST_MODE=true
      - TEST_AUTO_HUMAN_CONFIRMATION=false

  mailpit:
    container_name: homolog-mailpit
    ports: !override
      - '127.0.0.1:${HOMOLOG_MAILPIT_PORT:-28025}:8025'
