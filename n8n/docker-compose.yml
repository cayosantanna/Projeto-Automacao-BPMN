services:
  glpi-dedup-db:
    image: postgres:16.13@sha256:71e27bf60b70bded003791b5573f8b808365613f341df20ffcf0c1ed7bc13ddf
    container_name: glpi-dedup-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-triagem}
      - POSTGRES_USER=${POSTGRES_USER:-triagem_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em n8n/.env}
      - TZ=${TZ:-America/Sao_Paulo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - glpi-dedup-db-data:/var/lib/postgresql/data
      - '../database/init_v9.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triagem_user -d triagem']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - research_backend
      - database_host_access

  n8n:
    image: n8nio/n8n:2.10.3@sha256:7d90cdb066ae31f08776b0f8287d33102c4b55d7d0173faf5edb5767c94d2b83
    container_name: n8n
    restart: unless-stopped
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'

    env_file:
      - .env
      - .env.local

    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DISABLE_SANDBOX=true
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:?Defina N8N_BASIC_AUTH_USER em n8n/.env}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?Defina N8N_BASIC_AUTH_PASSWORD em n8n/.env}
      - GLPI_API_URL=${GLPI_API_URL:-http://host.docker.internal:9080/apirest.php}
      - WF01_GLPI_CHUNK_SIZE=${WF01_GLPI_CHUNK_SIZE:-10}
      - GLPI_APP_TOKEN=${GLPI_APP_TOKEN:?Defina GLPI_APP_TOKEN em n8n/.env}
      - GLPI_AUTH_BASIC=${GLPI_AUTH_BASIC:?Defina GLPI_AUTH_BASIC em n8n/.env}
      - GLPI_WEBHOOK_KEY=${GLPI_WEBHOOK_KEY:?Defina GLPI_WEBHOOK_KEY em n8n/.env}
      - FISCAL_WEBHOOK_KEY=${FISCAL_WEBHOOK_KEY:?Defina FISCAL_WEBHOOK_KEY em n8n/.env}
      - N8N_PUBLIC_BASE_URL=${N8N_PUBLIC_BASE_URL:-http://localhost:5678}
      - FISCAL_DECISION_BASE_URL=${FISCAL_DECISION_BASE_URL:-http://localhost:5678/webhook/fiscal-decisao-fiscal-ic-2026}
      - FISCAL_CONFIRMATION_BASE_URL=${FISCAL_CONFIRMATION_BASE_URL:-http://localhost:5678/webhook/fiscal-confirmacao-v9}
      - FISCAL_TOKEN_TTL_MINUTOS=${FISCAL_TOKEN_TTL_MINUTOS:-10080}
      - TEST_MODE=${TEST_MODE:-false}
      - TEST_AUTO_HUMAN_CONFIRMATION=${TEST_AUTO_HUMAN_CONFIRMATION:-false}
      - TEST_AUTO_REVIEW_TOKEN=${TEST_AUTO_REVIEW_TOKEN:-}
      - TEST_AUTO_REVIEW_BATCH_SIZE=${TEST_AUTO_REVIEW_BATCH_SIZE:-25}
      - DEDUP_CANDIDATE_LIMIT=${DEDUP_CANDIDATE_LIMIT:-20}
      - DEDUP_LOCAL_TOP_K=${DEDUP_LOCAL_TOP_K:-20}
      - FILA_IA_ATIVA=${FILA_IA_ATIVA:-true}
      - FILA_IA_LOTE_TAMANHO=${FILA_IA_LOTE_TAMANHO:-3}
      - FILA_IA_INTERVALO_SEGUNDOS=${FILA_IA_INTERVALO_SEGUNDOS:-45}
      - FILA_IA_LEASE_SEGUNDOS=${FILA_IA_LEASE_SEGUNDOS:-900}
      - FILA_IA_INGRESS_GRACE_SEGUNDOS=${FILA_IA_INGRESS_GRACE_SEGUNDOS:-10}
      - IA_RETRY_BASE_SEGUNDOS=${IA_RETRY_BASE_SEGUNDOS:-30}
      - IA_RETRY_MAX_SEGUNDOS=${IA_RETRY_MAX_SEGUNDOS:-900}
      - IA_RETRY_HARD_MAX_SEGUNDOS=${IA_RETRY_HARD_MAX_SEGUNDOS:-3600}
      - AVALIACAO_HUMANA_BASE_URL=${AVALIACAO_HUMANA_BASE_URL:-http://localhost:5678/webhook/avaliacao-humana-v9}
      - AVALIACAO_HUMANA_CONFIRMATION_BASE_URL=${AVALIACAO_HUMANA_CONFIRMATION_BASE_URL:-http://localhost:5678/webhook/avaliacao-humana-confirmacao-v9}
      - AVALIACAO_HUMANA_AMOSTRA_PERCENT=${AVALIACAO_HUMANA_AMOSTRA_PERCENT:-20}
      - AVALIACAO_HUMANA_AMOSTRA_MIN=${AVALIACAO_HUMANA_AMOSTRA_MIN:-30}
      - AVALIACAO_HUMANA_AMOSTRA_LIMIT=${AVALIACAO_HUMANA_AMOSTRA_LIMIT:-30}
      - AVALIACAO_HUMANA_TOKEN_TTL_DIAS=${AVALIACAO_HUMANA_TOKEN_TTL_DIAS:-30}
      - IA_CONFIANCA_MINIMA=${IA_CONFIANCA_MINIMA:-0.65}
      - IA_OBRA_CONFIANCA_MINIMA=${IA_OBRA_CONFIANCA_MINIMA:-0.90}
      - DEDUP_POSITIVE_THRESHOLD=${DEDUP_POSITIVE_THRESHOLD:-0.95}
      - DEDUP_NEGATIVE_THRESHOLD=${DEDUP_NEGATIVE_THRESHOLD:-0.07}
      - IA_GENERATION_SEED=${IA_GENERATION_SEED:-20260702}
      - IA_EXECUTION_MODE=${IA_EXECUTION_MODE:-OPERATIONAL}
      - IA_FAILOVER_ENABLED=${IA_FAILOVER_ENABLED:-true}
      - IA_FIXED_MODEL_ROLE=${IA_FIXED_MODEL_ROLE:-LOCAL}
      - IA_OPERATIONAL_SEQUENCE=${IA_OPERATIONAL_SEQUENCE:-LOCAL,SECONDARY}
      - IA_MODEL_SECONDARY=${IA_MODEL_SECONDARY:-gemini-3.5-flash}
      - IA_MODEL_LOCAL=${IA_MODEL_LOCAL:-local-hybrid-v1.8.0}
      - IA_LOCAL_BASE_URL=${IA_LOCAL_BASE_URL:-http://host.docker.internal:8090}
      - IA_LOCAL_API_TOKEN=${IA_LOCAL_API_TOKEN:?Defina IA_LOCAL_API_TOKEN em n8n/.env}
      - IA_LOCAL_TIMEOUT_MS=${IA_LOCAL_TIMEOUT_MS:-15000}
      - LOCAL_AI_EMBED_BACKEND=${LOCAL_AI_EMBED_BACKEND:-pytorch_fp32}
      - LOCAL_AI_EMBED_MODEL_REVISION=${LOCAL_AI_EMBED_MODEL_REVISION:-835ad14087e140460703cf0fae09f97d469d65c2}
      - IA_MODEL_NAME=${IA_MODEL_NAME:-local-native}
      - IA_MODEL_VERSION=${IA_MODEL_VERSION:-local-hybrid-v1.8.0}
      - IA_GENERATION_PROFILE=${IA_GENERATION_PROFILE:-local-hybrid-v1.8.0_granite97m-pytorch-fp32}
      - DEMO_EQUIPE_DISPONIVEL=${DEMO_EQUIPE_DISPONIVEL:-true}
      - PROMPT_DEDUP_VERSION=${PROMPT_DEDUP_VERSION:-deduplicacao_v9.1-episodica}
      - PROMPT_CLASSIF_VERSION=${PROMPT_CLASSIF_VERSION:-classificacao_v9.1-episodica}
      - AVALIACAO_DATASET_VERSION=${AVALIACAO_DATASET_VERSION:-dataset-v2.0.0-episodico}
      - METRICAS_ALERTA_EMAIL=${METRICAS_ALERTA_EMAIL:-infraestrutura@campus.local}
      - METRICAS_ALERTA_ERRO_IA_PERCENT=${METRICAS_ALERTA_ERRO_IA_PERCENT:-5}
      - METRICAS_ALERTA_TRIAGEM_MANUAL_PERCENT=${METRICAS_ALERTA_TRIAGEM_MANUAL_PERCENT:-25}
      - METRICAS_ALERTA_CHAMADOS_TRAVADOS=${METRICAS_ALERTA_CHAMADOS_TRAVADOS:-10}
      - INFRA_EMAIL=${INFRA_EMAIL:-infraestrutura@campus.local}
      - DDI_DG_EMAIL=${DDI_DG_EMAIL:-ddi-dg@campus.local}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168

    volumes:
    #n8n-data armazena: Workflows, credenciais, histórico de execuções e configurações da aplicação
        - n8n-data:/home/node/.n8n

    extra_hosts:
      - 'host.docker.internal:host-gateway' # permite que o n8n se comunique com serviços rodando no host 
    depends_on:
      glpi-dedup-db:
        condition: service_healthy
    networks:
      - research_backend
      - workflow_services

  mailpit:
    image: axllent/mailpit:v1.29.7@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    container_name: mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025'  # UI Web; SMTP permanece interno em mailpit:1025
    networks:
      - workflow_services


volumes:
  glpi-dedup-db-data:
  n8n-data:

networks:
  research_backend:
    internal: true
  workflow_services:
  database_host_access:
