services:
  tls-edge:
    image: nginx:1.27.5-alpine
    container_name: projeto-ic-tls-edge
    restart: unless-stopped
    ports:
      - "${TLS_BIND_ADDRESS:-127.0.0.1}:${TLS_PORT:-8443}:8443"
    environment:
      N8N_TLS_HOST: ${N8N_TLS_HOST:?configure N8N_TLS_HOST}
      GLPI_TLS_HOST: ${GLPI_TLS_HOST:?configure GLPI_TLS_HOST}
      GLPI_WEBHOOK_KEY: ${GLPI_WEBHOOK_KEY:?configure GLPI_WEBHOOK_KEY}
    command:
      - /bin/sh
      - -ec
      - >-
        envsubst '$$N8N_TLS_HOST $$GLPI_TLS_HOST $$GLPI_WEBHOOK_KEY'
        < /etc/nginx/templates/projeto-ic.conf.template
        > /etc/nginx/conf.d/default.conf
        && exec nginx -g 'daemon off;'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/projeto-ic.conf.template:ro
      - ${TLS_CERT_FILE:?configure TLS_CERT_FILE}:/run/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?configure TLS_KEY_FILE}:/run/tls/tls.key:ro
    networks:
      - n8n_services
      - glpi_services

networks:
  n8n_services:
    external: true
    name: n8n_workflow_services
  glpi_services:
    external: true
    name: glpi_glpi-net
